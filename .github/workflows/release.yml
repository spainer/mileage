name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag is a valid Docker image tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export LC_ALL=C
          if ! [[ "$TAG" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || [ "${#TAG}" -gt 128 ]; then
            echo "::error title=Invalid release tag '${TAG}'::Tag names must be valid Docker image tags."
            {
              echo "## Invalid release tag"
              echo ""
              echo "Tag \`${TAG}\` is not a valid Docker image tag, so the release was aborted before any build."
              echo ""
              echo "Docker tags must be at most 128 characters long and may only contain lowercase letters, digits,"
              echo "and the separators `.`, `_`, and `-`, which may not lead, trail, or repeat (e.g. `1.0.0` or `v1.0.0`)."
              echo ""
              echo "To retry, delete the tag, cut a valid one, and push it:"
              echo ""
              echo '```'
              echo "git push origin :refs/tags/${TAG}"
              echo "git tag <name>"
              echo "git push origin <name>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Tag '${TAG}' is a valid Docker image tag"

  backend-tests:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4"
      - name: Setup environment (uv --all-extras)
        working-directory: backend
        run: uv sync --all-extras
      - name: Run pytest (SQLite)
        working-directory: backend
        run: uv run pytest --tb=short -v

  frontend-unit-tests:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run vitest unit tests
        working-directory: frontend
        run: npx vitest run

  build-and-publish:
    needs: [validate-tag, backend-tests, frontend-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest

  smoke-test:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published image from registry
        run: docker pull "${IMAGE_NAME}:latest"
      - name: Start stack with repository compose file
        run: docker compose up -d
      - name: Wait for health endpoint
        run: |
          echo "Waiting for the app to become healthy ..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "App is up!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
      - name: Assert health endpoint returns 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health)
          echo "Health endpoint returned HTTP ${code}"
          [ "$code" = "200" ]
      - name: Assert app shell is served at the root
        run: |
          body=$(curl -sf http://localhost:8000/)
          echo "$body" | grep -q '<div id="app">'
      - name: Assert app shell is served for an extensionless client-side route
        run: |
          body=$(curl -sf http://localhost:8000/cars)
          echo "$body" | grep -q '<div id="app">'
      - name: Assert database file exists in the /data volume
        run: docker compose run --rm mileage test -f /data/mileage.db
      - name: Tear down stack and volume
        if: always()
        run: docker compose down -v
